<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sliver Admin</title>
  <style>
    :root {
      --bg: #F4F3FB; --card: #FFFFFF; --ink: #14123A; --ink-2: #5E5B85; --line: #E2E0F2;
      --accent: #2336E6; --good: #0B7A57; --bad: #C0263B; --chip: #EEF0FF;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0F0E16; --card: #1A1824; --ink: #F3F1FA; --ink-2: #A6A2BA; --line: #2C2939; --accent: #8FA0FF; --good: #5CF0BE; --bad: #FF8A9A; --chip: #24213A; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    h1 { font-size: 22px; margin: 0; }
    h2 { font-size: 15px; margin: 0 0 10px; color: var(--ink-2); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .muted { color: var(--ink-2); font-size: 13px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .tile { background: var(--chip); border-radius: 12px; padding: 12px; }
    .tile b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .tile span { color: var(--ink-2); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { color: var(--ink-2); font-weight: 600; font-size: 13px; }
    td.n, th.n { text-align: right; }
    .scroll { overflow-x: auto; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input { font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); min-width: 0; flex: 1 1 220px; }
    button { font: inherit; font-weight: 600; padding: 9px 14px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
    button.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--line); }
    .err { color: var(--bad); margin: 8px 0 0; }
    .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Sliver admin</h1>
    <div class="muted" id="updated"></div>
  </header>

  <section class="card" id="login">
    <h2>Admin key</h2>
    <form id="key-form">
      <input id="key" type="password" autocomplete="current-password" placeholder="The ADMIN_KEY you set on Render" />
      <button>Open</button>
    </form>
    <p class="err" id="err" hidden></p>
    <p class="muted">The key is remembered on this device only. <button class="ghost" id="forget" type="button">Forget key</button></p>
  </section>

  <div id="dash" hidden>
    <section class="card">
      <h2><span class="live-dot"></span>Right now</h2>
      <div class="tiles" id="live"></div>
    </section>
    <div class="grid2">
      <section class="card">
        <h2>Today</h2>
        <div class="tiles" id="today"></div>
      </section>
      <section class="card">
        <h2>All time</h2>
        <div class="tiles" id="total"></div>
      </section>
    </div>
    <section class="card">
      <h2>Open rooms</h2>
      <div class="scroll"><table id="rooms"></table></div>
    </section>
    <div class="grid2">
      <section class="card">
        <h2>Last 7 days</h2>
        <div class="scroll"><table id="days"></table></div>
      </section>
      <section class="card">
        <h2>Top ratings</h2>
        <div class="scroll"><table id="top"></table></div>
      </section>
    </div>
    <section class="card">
      <h2>Server</h2>
      <div class="tiles" id="server"></div>
    </section>
  </div>
</main>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const fmt = (n) => (n === null || n === undefined ? '–' : Number(n).toLocaleString());
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let key = (() => { try { return localStorage.getItem('sliver.adminKey') || ''; } catch { return ''; } })();
  let timer = null;
  const tiles = (items) => items.map(([v, label]) => `<div class="tile"><b>${typeof v === 'string' ? esc(v) : fmt(v)}</b><span>${esc(label)}</span></div>`).join('');

  async function load() {
    if (!key) return;
    let res;
    try {
      const r = await fetch('/api/admin/stats', { headers: { 'x-admin-key': key }, cache: 'no-store' });
      res = await r.json();
    } catch { res = { ok: false, error: 'Can\'t reach the server.' }; }
    if (!res.ok) {
      $('#err').textContent = res.error; $('#err').hidden = false;
      if (/Wrong admin key|off/i.test(res.error)) { $('#dash').hidden = true; $('#login').hidden = false; clearInterval(timer); timer = null; }
      return;
    }
    $('#err').hidden = true;
    $('#login').hidden = true;
    $('#dash').hidden = false;
    const L = res.live, T = res.total, D = res.days[0];
    $('#live').innerHTML = tiles([[L.players, 'players connected'], [L.activeRooms, 'rooms with players'], [L.playing, 'games being played'], [L.rankedNow, 'ranked games now'], [L.onlineAccounts, 'logged-in accounts online']]);
    $('#today').innerHTML = tiles([[D.games, 'games started'], [D.ranked, 'ranked games'], [D.songs, 'songs played'], [D.signups, 'new accounts'], [D.peak, 'most players at once']]);
    $('#total').innerHTML = tiles([[T.accounts, 'accounts'], [T.rankedPlayers, 'on the leaderboard'], [T.games, 'games started'], [T.ranked, 'ranked games'], [T.songs, 'songs played'], [T.peak, 'most players at once']]);
    $('#rooms').innerHTML = L.roomList.length
      ? `<tr><th>Room</th><th>Status</th><th class="n">Players</th><th>Host</th><th>Type</th><th class="n">Songs</th><th class="n">Idle</th></tr>` +
        L.roomList.map((r) => `<tr><td>${esc(r.code)}</td><td>${esc(r.phase === 'round' ? `song ${r.round}` : r.phase)}</td><td class="n">${r.players}${r.total !== r.players ? ` <span class="muted">/ ${r.total}</span>` : ''}</td><td>${esc(r.host || '–')}</td><td>${r.ranked ? 'Ranked' : 'Casual'} · ${esc(r.mode)}</td><td class="n">${fmt(r.songs)}</td><td class="n">${r.idleMin} min</td></tr>`).join('')
      : '<tr><td class="muted">No open rooms.</td></tr>';
    $('#days').innerHTML = `<tr><th>Day</th><th class="n">Games</th><th class="n">Songs</th><th class="n">Sign-ups</th><th class="n">Peak</th></tr>` +
      res.days.map((d) => `<tr><td>${esc(d.date)}</td><td class="n">${fmt(d.games)}</td><td class="n">${fmt(d.songs)}</td><td class="n">${fmt(d.signups)}</td><td class="n">${fmt(d.peak)}</td></tr>`).join('');
    $('#top').innerHTML = res.top.length
      ? `<tr><th class="n">#</th><th>Player</th><th class="n">Rating</th></tr>` + res.top.map((t) => `<tr><td class="n">${t.rank}</td><td>${esc(t.name)} ${t.tag ? `<span class="muted">#${esc(t.tag)}</span>` : ''}</td><td class="n">${fmt(t.rating)}</td></tr>`).join('')
      : '<tr><td class="muted">No ranked games yet.</td></tr>';
    const S = res.server;
    $('#server').innerHTML = tiles([[`${S.uptimeMin} min`, 'since the server woke up'], [`${S.memoryMB} MB`, 'memory'], [S.database, 'accounts saved in'], [S.emailCodes, 'email codes'], [S.node, 'Node']]);
    $('#updated').textContent = `Updated ${new Date(res.now).toLocaleTimeString()} · refreshes every 10 s`;
    if (!timer) timer = setInterval(load, 10000);
  }

  $('#key-form').onsubmit = (e) => {
    e.preventDefault();
    key = $('#key').value.trim();
    try { localStorage.setItem('sliver.adminKey', key); } catch {}
    load();
  };
  $('#forget').onclick = () => {
    key = ''; try { localStorage.removeItem('sliver.adminKey'); } catch {}
    clearInterval(timer); timer = null;
    $('#dash').hidden = true; $('#login').hidden = false; $('#key').value = '';
  };
  load();
})();
</script>
</body>
</html>
